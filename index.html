<body class="page-travel-hub">
  <header class="site-header">
    <div class="container">
      <nav class="nav" aria-label="主導覽">
        <a class="brand" href="index.html">
          <span>我們的小旅行</span>
        </a>
        <div class="menu">
          <a href="kyushu.html">九州櫻花</a>
          <a href="chiang-mai.html">清邁</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <header style="margin-bottom:20px">
          <p class="kicker">Penny 旅遊</p>
          <h1 style="margin-bottom:8px">選一段我們要一起去的旅程</h1>
          <p class="article-lead" style="margin:0 0 12px; font-size:15px; line-height:1.55; color:var(--muted)">Penny 旅遊不是傳統行程表，而是可以用 <strong>LINE 對話</strong>快速生成的個人旅行 App 頁面。下面兩則為實際規劃範例。</p>
        </header>

        <div class="grid-2" style="gap:14px">
          <a class="card" href="kyushu.html" style="text-decoration:none; color:inherit; display:block">
            <p class="kicker" style="margin-bottom:6px">日本 · 九州</p>
            <h2 style="margin:0 0 8px; font-size:18px">要帶寶貝去九州看櫻花嘍</h2>
            <p class="small" style="margin:0 0 12px; line-height:1.55">六日自駕：熊本城、一心行大櫻、黑川溫泉、御船山夜櫻、柳川遊船、秋月城跡⋯⋯</p>
            <span class="card-link">開啟九州行程</span>
          </a>
          <a class="card" href="chiang-mai.html" style="text-decoration:none; color:inherit; display:block">
            <p class="kicker" style="margin-bottom:6px">泰國 · 清邁／清萊</p>
            <h2 style="margin:0 0 8px; font-size:18px">清邁 8 天 7 夜（App 手冊）</h2>
            <p class="small" style="margin:0 0 12px; line-height:1.55">水燈與天燈、古城、清萊、大象、市集⋯⋯每日時間軸、可下載 Markdown 筆記。</p>
            <span class="card-link">開啟清邁行程</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="small" style="margin:0">我們兩個 · 行程入口</p>
